version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: docubrin_redis
    command: redis-server --requirepass "${REDIS_PASSWORD:-docubrin_secret_password}"
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-docubrin_secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: docubrin_clamav
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G # ClamAV is memory intensive
    healthcheck:
      test: ["CMD", "clamdscan", "--version"]
      interval: 20s
      timeout: 10s
      retries: 5

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: docubrin_api
    init: true
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-docubrin_secret_password}@redis:6379/0
      - CLAMD_HOST=clamav
    volumes:
      - docubrin_temp:/tmp/docubrin
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: docubrin_worker
    init: true
    command: celery -A tasks worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-docubrin_secret_password}@redis:6379/0
    volumes:
      - docubrin_temp:/tmp/docubrin
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G # LibreOffice needs some RAM

  beat:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: docubrin_janitor
    init: true
    command: celery -A tasks beat --loglevel=info
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-docubrin_secret_password}@redis:6379/0
    volumes:
      - docubrin_temp:/tmp/docubrin
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: docubrin_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  frontend:
  backend:
    internal: true

volumes:
  docubrin_temp:
